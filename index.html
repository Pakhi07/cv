<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Portfolio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* Navigation Bar */
        nav {
            background: #24292e; /* GitHub Dark Theme Color */
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
        }

        .btn-download {
            background-color: #2ea44f;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-download:hover {
            background-color: #2c974b;
        }

        /* PDF Container */
        .pdf-container {
            height: calc(100vh - 60px);
            width: 100%;
        }

        embed {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="pdf-container">
        <embed src="Pakhi_Banchalia_CV.pdf" type="application/pdf" />
    </div>

</body>
</html>
